<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Casino</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; background: #1c1c1c; color: white; padding: 20px; }
        .btn { background: #0088cc; color: white; border: none; padding: 15px 30px; border-radius: 10px; font-size: 18px; cursor: pointer; }
        .stars-icon { font-size: 50px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="stars-icon">⭐️</div>
    <h1>Star Casino</h1>
    <p>Твой баланс: <span id="balance">103</span></p>
    <button class="btn" onclick="sendBet()">Сделать ставку (10 ★)</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function sendBet() {
            // Отправляем данные боту, что пользователь хочет сделать ставку
            tg.sendData("bet_10");
        }
    </script>
</body>
</html>
